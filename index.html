<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingenia Mobiliario</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
<style>
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#fff;color:#0B1F3A;font-family:"Inter",system-ui,sans-serif;line-height:1.6}
header{background:linear-gradient(104deg,#0B1F3A 0%,#0B1F3A 48%,#2C4260 82%,#6C7C92 100%)}
.inner{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .inner{padding-block:26px}
h1{font-size:26px;font-weight:500;margin:0 0 6px;color:#fff;letter-spacing:.02em}
.baja{margin:0;color:#AEBCCE;font-size:15px;font-weight:300}
main .inner{padding-block:30px 46px}
h2{font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#5A6B80;margin:0 0 14px}
a.card{display:block;border:1px solid #DDE2E8;padding:16px 18px;text-decoration:none;color:inherit}
a.card:hover{border-color:#6C7C92}
a.card strong{display:block;font-weight:500;font-size:17px}
a.card span{color:#5A6B80;font-size:14px}
</style>
</head>
<body>
<header><div class="inner">
<h1>INGENIA MOBILIARIO</h1>
<p class="baja">Camas, muebles y closets a medida</p>
</div></header>
<main><div class="inner">
<h2>Presentaciones</h2>
<a class="card" href="nube-king/"><strong>Cama Nube · King</strong><span>Elige cantidad de figuras y tono de tela, y véala en 3D</span></a>
</div></main>
</body>
</html>
